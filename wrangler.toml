name = "devopsdaily-api"
main = "src/worker.js"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.dailydevops.blog", custom_domain = true }
]

[triggers]
crons = ["*/2 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "devopsdaily-db"
database_id = "5d5e6e73-4d79-44cd-b492-87ef539a81a6"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "devopsdaily-media"

[vars]
NODE_ENV = "production"
API_PREFIX = "api/v1"
APP_URL = "https://dailydevops.blog"
CORS_ORIGIN = "https://dailydevops.blog,https://www.dailydevops.blog,https://devopsdaily-web.devopsdaily.workers.dev,http://localhost:3000"
JWT_ACCESS_EXPIRES_IN = "15m"
JWT_REFRESH_EXPIRES_IN = "7d"
RATE_LIMIT_WINDOW_MS = "60000"
RATE_LIMIT_MAX_REQUESTS = "300"
SWAGGER_ENABLED = "false"
SMTP_HOST = "mail.thienduong.info"
SMTP_PORT = "465"
SMTP_SECURE = "true"
SMTP_USER = "dailydevops@thienduong.info"
CONTACT_INBOX = "dailydevops@thienduong.info"
EMAIL_FROM = "DevOps Daily <dailydevops@thienduong.info>"
S3_ENDPOINT = "https://vn-fpt.azcloudstorage.com"
S3_REGION = "auto"
S3_BUCKET = "dailydevops"
LOG_FORMAT = "json"
LOG_SKIP_HEALTH = "true"
LOG_ONLY_API = "true"
